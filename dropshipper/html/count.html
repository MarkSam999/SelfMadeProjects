<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Your new order</title>
        <!--jQuery-->
            <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <!--JavaScript-->
            <script src="../js/count.js"></script>
        <!--Main CSS-->
            <link rel="stylesheet" href="../css/prime.css">
        <!--Page Type-->
            <link rel="stylesheet" href="../css/pageTypes/form.css">
    </head>
    <body>
        <div id="background">
            <div id="content">
                <form>
                    <fieldset>
                        <legend>Calculation of total cost</legend>
                        <label for="truckType">Choose your truck type:</label>
                        <select id="truckType">
                            <option selected></option>
                            <option value="pickup">Pickup</option>
                            <option value="minivan">Minivan</option>
                            <option value="van">Van</option>
                            <option value="semi-truck">Semi-truck</option>
                            <option value="truck">Truck</option>
                        </select>
                        <label for="distance">Enter the distance of your route:</label>
                        <input type="number" id="distance" min="0" placeholder="0">
                        <label for="weight">Enter the weight of your cargo:</label>
                        <input type="number" id="weight" min="0" placeholder="0">
                        <button type="submit" onclick="count();">Count</button>
                        <p class="warning">Caution! All fields are <b>required</b>.</p>    
                    </fieldset>
                    <a class="link" href="home.html">← Back to home</a>
                </form>        
            </div>  
        </div>
        
    </body>
</html>
